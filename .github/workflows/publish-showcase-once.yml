name: Publish PadRevive showcase once

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-showcase-once.yml]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish PadRevive showcase'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      TAG: v0.12.0-beta.2-native-ui.2
      SOURCE: PadRevive-0.12.0-beta.2-source.zip
    steps:
      - uses: actions/checkout@v4
      - name: Remove this one-time publisher and package the source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f -- .github/workflows/publish-showcase-once.yml
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the one-time publisher.' }
          git commit -m 'Remove one-time showcase publisher'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit publisher cleanup.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Main changed during publication; no files were overwritten.' }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          git archive --format=zip --prefix=PadRevive/ -o (Join-Path release-assets $env:SOURCE) HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not package the source.' }
          foreach ($padReviveScreen in @('controller','test','rumble','workbench','revive-lab')) {
            Copy-Item ("screenshots/$padReviveScreen.png") ("release-assets/PadRevive-$padReviveScreen.png")
          }
      - name: Publish screenshots and the release description
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $padReviveFiles = @(Get-ChildItem release-assets -File | ForEach-Object FullName)
          gh release upload $env:TAG @padReviveFiles --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --notes-file RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release description update failed.' }
          $padReviveRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release assets.' }
          if ($padReviveRelease.assets.name -contains 'PadRevive-4K.png') {
            gh release delete-asset $env:TAG 'PadRevive-4K.png' --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not retire the resolution preview.' }
          }
          $padReviveRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read final release assets.' }
          $padReviveChecksums = foreach ($padReviveAsset in $padReviveRelease.assets) {
            if ($padReviveAsset.name -eq 'SHA256SUMS.txt') { continue }
            if ($padReviveAsset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'A release asset checksum is unavailable.' }
            "$($padReviveAsset.digest.Substring(7))  $($padReviveAsset.name)"
          }
          $padReviveChecksums | Set-Content release-assets/SHA256SUMS.txt
          gh release upload $env:TAG release-assets/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Checksum update failed.' }
